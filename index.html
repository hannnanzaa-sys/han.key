<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HANX HUB KEY</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: radial-gradient(circle at top, #24123d, #0d0b14 70%); color: #f8f5ff;
    }
    .card {
      width: 100%; max-width: 420px; background: #141021; border: 1px solid #523e7c;
      border-radius: 16px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,.55);
    }
    h1 { margin: 0 0 6px; font-size: 20px; }
    p { margin: 0 0 18px; font-size: 13px; color: #9c94b2; line-height: 1.5; }
    .key-box {
      background: #1d1630; border: 1px solid #7e49c9; border-radius: 12px;
      padding: 16px; text-align: center; font-size: 18px; font-weight: 700;
      letter-spacing: 1px; color: #d8b4fe; word-break: break-all; margin-bottom: 12px;
    }
    .meta { font-size: 12px; color: #9c94b2; margin-bottom: 16px; text-align: center; }
    .err { color: #fb7185; font-size: 13px; text-align: center; margin-bottom: 12px; }
    button {
      width: 100%; padding: 12px; border: 0; border-radius: 10px; cursor: pointer;
      background: #7e22ce; color: #fff; font-weight: 700; font-size: 14px;
    }
    button:hover { background: #9333ea; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔑 HANX HUB KEY</h1>
    <p>Key otomatis dibuat dan terikat ke device kamu (berlaku 1 hari / 24 jam).</p>
    <div id="keyBox" class="key-box">Memuat key…</div>
    <div id="metaBox" class="meta">Mendeteksi device…</div>
    <div id="errBox" class="err"></div>
    <button id="copyBtn" type="button" disabled>Copy Key</button>
  </div>

  <script>
    const SUPABASE_URL = "https://hmfmhraaoowaclkjgoyo.supabase.co";
    const SUPABASE_ANON = "sb_publishable_Epc5E_uB8e0BiOwnxXPDIQ_33BrW5Di";

    const keyBox = document.getElementById("keyBox");
    const metaBox = document.getElementById("metaBox");
    const errBox = document.getElementById("errBox");
    const copyBtn = document.getElementById("copyBtn");

    function resolveDeviceId() {
      const params = new URLSearchParams(window.location.search);
      const urlHwid = (params.get("hwid") || "").trim();
      if (urlHwid) return { id: urlHwid, source: "Roblox Device ID" };

      let webId = localStorage.getItem("hanx_web_device_id");
      if (!webId) {
        webId = "WEB_" + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2, 14));
        localStorage.setItem("hanx_web_device_id", webId);
      }
      return { id: webId, source: "Browser Device ID" };
    }

    async function loadKey() {
      const device = resolveDeviceId();
      metaBox.textContent = `Sumber ID: ${device.source}`;

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/issue_or_check_key`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON,
            "Authorization": `Bearer ${SUPABASE_ANON}`,
          },
          body: JSON.stringify({
            p_hwid: device.id,
            p_mode: "issue",
          }),
        });

        const data = await res.json();
        if (!res.ok || !data || data.valid !== true || !data.key) {
          keyBox.textContent = "GAGAL";
          errBox.textContent = (data && data.message) || "Gagal mengambil key dari server.";
          return;
        }

        keyBox.textContent = data.key;
        const expText = data.expires_at ? new Date(data.expires_at).toLocaleString("id-ID") : "1 hari";
        metaBox.textContent = `Berlaku sampai: ${expText}`;
        copyBtn.disabled = false;

        copyBtn.onclick = async () => {
          try {
            await navigator.clipboard.writeText(data.key);
            copyBtn.textContent = "✔ Key Tersalin!";
            setTimeout(() => { copyBtn.textContent = "Copy Key"; }, 1500);
          } catch {
            errBox.textContent = "Gagal menyalin otomatis, silakan salin manual.";
          }
        };
      } catch (e) {
        keyBox.textContent = "ERROR";
        errBox.textContent = "Tidak dapat terhubung ke Supabase.";
      }
    }

    loadKey();
  </script>
</body>
</html>
